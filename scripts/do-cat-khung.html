<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bàn đo Cắt khung văn bản</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 0; padding: 16px; background: #f5ecdf; color: #2c2117; }
  pre { background: #fffcf4; border: 1px solid #e2d0ba; border-radius: 8px; padding: 12px; white-space: pre-wrap; }
  h3 { margin: 18px 0 6px; }
  .anh { display: flex; gap: 10px; flex-wrap: wrap; }
  .anh img { max-width: 210px; border: 1px solid #e2d0ba; border-radius: 8px; }
  .anh figcaption { font-size: 12px; color: #6b5a48; }
</style>
</head>
<body>
<h2>Bàn đo Cắt khung văn bản</h2>
<p>Chạy trên <b>đúng mã đang phát hành</b> trong <code>public/assets/js/cat-khung.js</code>.</p>
<pre id="kq">đang đo…</pre>
<h3>Cảnh dựng để thử (đã thu nhỏ)</h3>
<div class="anh" id="anhThu"></div>

<script type="module">
import { nenAnhChung, coByteCuaDataUrl } from '/assets/js/anh-chung.js';
import { moQuetTaiLieu, ANH_TRANG, ANH_BOC_CHU } from '/assets/js/quet-tai-lieu.js';
import { doanBonGoc, duoiPhang, lamRoChu, taiAnh, canvasThanhTep } from '/assets/js/cat-khung.js';
import { veToGiay, datGiayVaoCanh, nenBanGo, nenTrang, themNhieu, TI_THANH_MOC }
  from '/lib/trang-giay-thu.js';

const dong = [];
const ghi = (s) => { dong.push(s); document.getElementById('kq').textContent = dong.join('\n'); };
const kb = (b) => (b / 1024).toFixed(0) + ' KB';
const mb = (b) => (b / 1048576).toFixed(2) + ' MB';
const cho = (ms) => new Promise(r => setTimeout(r, ms));
const doi = async (chon, hen = 6000) => {
  const t = Date.now();
  while (Date.now() - t < hen) {
    const e = document.querySelector(chon);
    if (e) return e;
    await cho(40);
  }
  throw new Error('Không thấy ' + chon);
};
const dat = (ok, ten, phu = '') => ghi(`  ${ok ? 'ĐẠT ' : '✗ HỎNG'}  ${ten}${phu ? '   ' + phu : ''}`);

/* Cỡ cảm biến 12MP dọc — đúng ảnh điện thoại công ty đang chụp. */
const W12 = 3024, H12 = 4032;

function canvasThanhFile(c, ten, cl = 0.95) {
  return new Promise(r => c.toBlob(b => r(new File([b], ten, { type: 'image/jpeg' })), 'image/jpeg', cl));
}

/* ==========================================================================
   DỰNG SÁU CẢNH THẬT
   ---------------------------------------------------------------------------
   Mỗi cảnh trả về `{ ten, canvas, goc }` — `goc` là 4 góc THẬT của tờ giấy
   (chuẩn hoá 0..1). Có góc thật thì mới chấm được "máy đoán lệch bao nhiêu",
   thay vì chấm bằng mắt.
   ========================================================================== */
function dungCanh(ten) {
  const nen = ten === 'trang-tren-trang' ? nenTrang(W12, H12) : nenBanGo(W12, H12);
  /* Tờ giấy vẽ ở cỡ vừa phải rồi mới đặt vào cảnh: vẽ ở 12MP rồi thu nhỏ là
     tốn vài giây mà không thêm thông tin. */
  const giay = veToGiay(1500, 2000, { nhieu: 10,
    nenGiay: ten === 'trang-tren-trang' ? '#fbfaf6' : '#f7f4ec' });

  const G = {
    /* Giấy nằm ngay ngắn trên bàn, chiếm ~62% khung — ca hay gặp nhất. */
    'ban-go':          [[0.15, 0.12], [0.86, 0.10], [0.88, 0.90], [0.13, 0.88]],
    'trang-tren-trang':[[0.15, 0.12], [0.86, 0.10], [0.88, 0.90], [0.13, 0.88]],
    /* Chụp nghiêng thật: cạnh trên ngắn hơn cạnh dưới, cả khung xoay ~7°. */
    'nghieng':         [[0.24, 0.14], [0.83, 0.20], [0.90, 0.86], [0.11, 0.78]],
    'che-goc':         [[0.15, 0.12], [0.86, 0.10], [0.88, 0.90], [0.13, 0.88]],
    'hai-to':          [[0.06, 0.10], [0.47, 0.10], [0.47, 0.62], [0.06, 0.62]],
    /* Chụp sát giấy: giấy KÍN khung → không có gì để cắt. */
    'kin-khung':       [[0.004, 0.004], [0.996, 0.004], [0.996, 0.996], [0.004, 0.996]],
    /* CHỤP XA + THIẾU SÁNG — đúng cảnh Sếp mô tả: "chụp rộng". Tờ giấy chỉ
       chiếm ~21% diện tích khung, lại hơi nghiêng, lại có bóng đổ vắt ngang.
       Đây mới là ca để trả lời "cắt khung có làm AI đọc tốt lên không";
       ca `ban-go` (giấy chiếm 62%) quá dễ, ba tấm đều 8/8, đo không ra gì. */
    'chup-xa':         [[0.31, 0.27], [0.72, 0.24], [0.75, 0.75], [0.28, 0.71]]
  }[ten];

  const gocPx = G.map(g => [g[0] * W12, g[1] * H12]);
  datGiayVaoCanh(nen, giay, gocPx);

  if (ten === 'hai-to') {
    /* Tờ thứ hai, lệch chỗ và hơi nghiêng — đúng cảnh đặt hai tờ chụp một
       phát. Máy chỉ được chọn MỘT tứ giác; chọn tờ nào cũng được, miễn là
       không đẻ ra một khung ôm cả hai rồi khoe là tự tin. */
    const g2 = [[0.53, 0.34], [0.95, 0.38], [0.93, 0.92], [0.51, 0.88]]
      .map(g => [g[0] * W12, g[1] * H12]);
    datGiayVaoCanh(nen, veToGiay(1500, 2000, { nhieu: 10 }), g2);
  }
  if (ten === 'che-goc') {
    /* Bàn tay che góc dưới-phải — mép giấy đứt hẳn một đoạn. */
    const x = nen.getContext('2d');
    x.fillStyle = '#c98d63';
    x.beginPath();
    x.ellipse(W12 * 0.88, H12 * 0.88, W12 * 0.16, H12 * 0.10, -0.4, 0, Math.PI * 2);
    x.fill();
    themNhieu(x, W12, H12, 12);
  }
  if (ten === 'chup-xa') {
    /* Bóng đổ vắt chéo + thiếu sáng chung. Đây là thứ `lamRoChu()` sinh ra để
       xoá, và là thứ làm AI đọc sai trong kho — không phải "thiếu tương phản"
       chung chung. Không dựng nó ra thì phép đo "làm rõ chữ có ích không"
       không có gì để đo. */
    const x = nen.getContext('2d');
    const g = x.createLinearGradient(0, 0, W12, H12);
    g.addColorStop(0, 'rgba(20, 14, 8, 0)');
    g.addColorStop(0.45, 'rgba(20, 14, 8, .30)');
    g.addColorStop(1, 'rgba(20, 14, 8, .62)');
    x.fillStyle = g;
    x.fillRect(0, 0, W12, H12);
    themNhieu(x, W12, H12, 22);
  }
  return { ten, canvas: nen, goc: G };
}

/* ==========================================================================
   THƯỚC ĐO ĐỘ NGHIÊNG — độc lập với `cat-khung.js`
   ---------------------------------------------------------------------------
   Tờ giấy thử có một THANH KẺ ĐEN ngang hết bề ngang. Quét cột trái và cột
   phải tìm hàng tối nhất; chênh lệch hai hàng chia cho khoảng cách hai cột ra
   độ nghiêng còn lại. Duỗi phẳng đúng thì con số này ≈ 0.
   Đây là phép đo bằng ĐIỂM ẢNH, không gọi một dòng nào của mã đang bị đo.
   ========================================================================== */
function doNghiengConLai(c) {
  const W = c.width, H = c.height;
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  /* Tìm HÀNG CÓ NHIỀU ĐIỂM TỐI NHẤT trong một cửa sổ ngang, chứ không tìm
     "hàng tối nhất tại một cột". Thanh mốc kéo hết bề ngang tờ giấy nên phủ
     gần 100% cửa sổ; chữ tiêu đề dày mấy cũng chỉ phủ vài chục phần trăm.
     Bản đầu dò một cột 9px và đã bắt nhầm nét chữ — sai đúng ở chỗ cần đúng. */
  /* Quét CẢ GÓC lẫn vị trí: với mỗi góc nghiêng thử và mỗi hàng, đếm điểm tối
     dọc theo đường nghiêng đó. Thanh mốc là vệt đen liền hết bề ngang nên ở
     ĐÚNG góc của nó sẽ phủ ~100% số điểm lấy mẫu; dòng chữ thân bài có khoảng
     trắng giữa các chữ nên không bao giờ tới đó.
     Bản trước chỉ dò theo hàng NGANG và đã bắt nhầm dòng chữ khi thanh mốc
     nghiêng — thanh nghiêng thì không hàng ngang nào phủ nổi nó. */
  const xa = Math.round(W * 0.12), xb = Math.round(W * 0.88), SO_MAU = 80;
  const y0 = Math.round(H * 0.05), y1 = Math.round(H * 0.45);
  const giuaX = (xa + xb) / 2;
  let tot = -1, gocTot = 0;
  for (let i = 0; i <= 40; i++) {
    const goc = (-20 + i) * Math.PI / 180;
    const dy = Math.tan(goc);
    for (let y = y0; y < y1; y++) {
      let dem = 0;
      for (let k = 0; k < SO_MAU; k++) {
        const x = Math.round(xa + (xb - xa) * k / (SO_MAU - 1));
        const yy = Math.round(y + dy * (x - giuaX));
        if (yy < 0 || yy >= H) continue;
        const p = (yy * W + x) << 2;
        if (0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2] < 110) dem++;
      }
      if (dem > tot) { tot = dem; gocTot = goc; }
    }
  }
  return { do: gocTot * 180 / Math.PI, phu: tot / SO_MAU };
}

const KHOA = 'tl_nhap_v1_kho_chung_chung';
try {

/* ==========================================================================
   ① THỜI GIAN TỪNG BƯỚC TRÊN ẢNH 12MP
   ========================================================================== */
ghi('─── ① THỜI GIAN XỬ LÝ, ảnh 12MP 3024×4032 (mili-giây thật) ───');
const canh = dungCanh('ban-go');
const tepGoc12 = await canvasThanhFile(canh.canvas, 'chup.jpg');
ghi(`  Ảnh chụp gốc: ${mb(tepGoc12.size)} · ${W12}×${H12}`);

/* Đường thật của sản phẩm: NÉN TRƯỚC (mọi trang đều đi qua đây), rồi mới cắt.
   Đo trên ảnh đã nén chứ không trên ảnh 12MP thô là ĐÚNG với sản phẩm —
   `moCatTuDong()` chạy sau `nenAnhChung()`. */
let t0 = performance.now();
const nenDau = await nenAnhChung(tepGoc12, ANH_TRANG);
const msNenDau = performance.now() - t0;
const anhNen = await taiAnh(nenDau);
ghi(`  Nén ảnh chụp (nenAnhChung, đường cũ, KHÔNG đổi): ` +
    `${msNenDau.toFixed(0)} ms → ${kb(coByteCuaDataUrl(nenDau))} · ${anhNen.naturalWidth}×${anhNen.naturalHeight}`);

/* Dò góc chạy hai lượt: một trên ảnh 12MP thô (để biết trần), một trên ảnh
   đã nén (đường thật). Nêu cả hai để không ai tưởng số nhỏ là do gian lận. */
const doTho = doanBonGoc(await taiAnh(URL.createObjectURL(tepGoc12)));
const doThat = doanBonGoc(anhNen);
ghi(`  Dò 4 góc trên ảnh 12MP thô:      ${doTho.ms} ms   (${doTho.tuTin ? 'tự tin' : 'không tự tin'})`);
ghi(`  Dò 4 góc trên ảnh đã nén 1700px: ${doThat.ms} ms   (${doThat.tuTin ? 'tự tin' : 'không tự tin'}) ← đường thật`);

const kqDuoi = duoiPhang(anhNen, canh.goc, { canhToiDa: ANH_TRANG.canhToiDa });
ghi(`  Duỗi phẳng (phối cảnh + song tuyến): ${kqDuoi.ms} ms → ${kqDuoi.rong}×${kqDuoi.cao}`);

const cLamRo = duoiPhang(anhNen, canh.goc, { canhToiDa: ANH_TRANG.canhToiDa }).canvas;
lamRoChu(cLamRo);
ghi(`  Làm rõ chữ (chia nền + kéo giãn):    ${cLamRo.msLamRo} ms`);

t0 = performance.now();
const tepCat = await canvasThanhTep(kqDuoi.canvas, 'cat.jpg');
const nenCat = await nenAnhChung(tepCat, ANH_TRANG);
const msNenLai = performance.now() - t0;
ghi(`  Nén lại sau cắt (cùng nenAnhChung):  ${msNenLai.toFixed(0)} ms`);

/* ⚠️ TỔNG PHẢI ĐO BẤM GIỜ MỘT LƯỢT, KHÔNG ĐƯỢC CỘNG BA CON SỐ RỜI.
   REV-0056 bắt đúng chỗ này: bản báo cáo trước tôi cộng dò+duỗi+nén ra 0,08 s
   rồi khai đó là "tổng một lượt cắt". Cộng như thế BỎ MẤT ba thứ có thật:
   giải mã ảnh (`taiAnh`), mã hoá canvas ra tệp (`toBlob`), và lượt vẽ lại màn
   hình. Số thật cao hơn ~1,5–2 lần. Đo lại bằng MỘT cái đồng hồ ôm cả đường. */
const doMotLuot = async (coLamRo) => {
  const t = performance.now();
  const im = await taiAnh(nenDau);
  doanBonGoc(im);
  const k = duoiPhang(im, canh.goc, { canhToiDa: ANH_TRANG.canhToiDa });
  if (coLamRo) lamRoChu(k.canvas);
  await nenAnhChung(await canvasThanhTep(k.canvas, 'e2e.jpg'), ANH_TRANG);
  return performance.now() - t;
};
/* Chạy nháp một lượt rồi mới bấm giờ: lượt đầu tiên gánh cả chi phí JIT làm
   nóng, nên nếu không hâm trước thì "có làm rõ chữ" đo ra NHANH HƠN "không
   làm rõ chữ" — một con số vô lý mà vẫn in ra được. */
await doMotLuot(true);
const msTong = await doMotLuot(false);
const msTongRo = await doMotLuot(true);
ghi(`  TỔNG BẤM GIỜ MỘT LƯỢT (giải mã → dò → duỗi → mã hoá → nén):`);
ghi(`    ${(msTong / 1000).toFixed(2)} s (không làm rõ chữ) · ` +
    `${(msTongRo / 1000).toFixed(2)} s (có làm rõ chữ)`);
ghi(`    Cộng ba bước rời chỉ ra ${((doThat.ms + kqDuoi.ms + msNenLai) / 1000).toFixed(2)} s — ` +
    `ĐỪNG lấy số đó làm tổng, nó bỏ mất giải mã + mã hoá + vẽ lại.`);
dat(msTongRo < 4000, 'Dưới 4 giây — ngưỡng người ta còn chờ được', `→ ${(msTongRo / 1000).toFixed(2)} s`);

/* ==========================================================================
   ② CỠ FILE TRƯỚC / SAU CẮT
   ========================================================================== */
ghi('\n─── ② CỠ FILE TRƯỚC / SAU CẮT ───');
const coTruoc = coByteCuaDataUrl(nenDau);
const coSau = coByteCuaDataUrl(nenCat);
const nenCatRo = await nenAnhChung(await canvasThanhTep(cLamRo, 'ro.jpg'), ANH_TRANG);
const coSauRo = coByteCuaDataUrl(nenCatRo);
ghi(`  Nguyên ảnh (có cả mặt bàn):     ${kb(coTruoc)}`);
ghi(`  Sau cắt khung:                  ${kb(coSau)}   (${coSau < coTruoc ? 'nhẹ đi' : 'nặng thêm'} ` +
    `${Math.abs(100 - coSau / coTruoc * 100).toFixed(0)}%)`);
ghi(`  Sau cắt + làm rõ chữ:           ${kb(coSauRo)}   (${coSauRo < coTruoc ? 'nhẹ đi' : 'nặng thêm'} ` +
    `${Math.abs(100 - coSauRo / coTruoc * 100).toFixed(0)}%)`);
dat(coSau <= ANH_TRANG.gioiHanByte && coSauRo <= ANH_TRANG.gioiHanByte,
  `Cả hai vẫn dưới trần ${kb(ANH_TRANG.gioiHanByte)} của một trang`);

/* Ghi ảnh cho bàn đo BÓC CHỮ — đúng thông số `ANH_BOC_CHU` của sản phẩm. */
{
  const anhTruoc = await nenAnhChung(tepGoc12, ANH_BOC_CHU);
  const anhSau = await nenAnhChung(await canvasThanhTep(kqDuoi.canvas, 'a.jpg'), ANH_BOC_CHU);
  const anhSauRo = await nenAnhChung(await canvasThanhTep(cLamRo, 'b.jpg'), ANH_BOC_CHU);
  /* CA THỨ HAI: chụp XA + thiếu sáng. Đây mới là ca có sức phân biệt — ca gần
     ở trên dễ tới mức cả ba tấm đều 8/8 trường, đo không ra chênh lệch nào. */
  const cXa = dungCanh('chup-xa');
  const nenXa = await nenAnhChung(await canvasThanhFile(cXa.canvas, 'xa.jpg'), ANH_TRANG);
  const imXa = await taiAnh(nenXa);
  const catXa = duoiPhang(imXa, cXa.goc, { canhToiDa: ANH_TRANG.canhToiDa });
  const catXaRo = duoiPhang(imXa, cXa.goc, { canhToiDa: ANH_TRANG.canhToiDa }).canvas;
  lamRoChu(catXaRo);

  const anhXaTruoc = await nenAnhChung(await canvasThanhFile(cXa.canvas, 'x1.jpg'), ANH_BOC_CHU);
  const anhXaSau = await nenAnhChung(await canvasThanhTep(catXa.canvas, 'x2.jpg'), ANH_BOC_CHU);
  const anhXaRo = await nenAnhChung(await canvasThanhTep(catXaRo, 'x3.jpg'), ANH_BOC_CHU);

  const r = await fetch('/luu-anh-thu', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      'cat-truoc': anhTruoc, 'cat-sau': anhSau, 'cat-sau-lamro': anhSauRo,
      'cat-xa-truoc': anhXaTruoc, 'cat-xa-sau': anhXaSau, 'cat-xa-sau-lamro': anhXaRo
    })
  });
  ghi(`  Đã ghi ${(await r.json()).so_tep} ảnh vào .do-tam/ cho bàn đo bóc chữ`);
  ghi(`    ca GẦN (giấy chiếm ~62% khung): trước ${kb(coByteCuaDataUrl(anhTruoc))} · ` +
      `sau ${kb(coByteCuaDataUrl(anhSau))} · sau+rõ ${kb(coByteCuaDataUrl(anhSauRo))}`);
  ghi(`    ca XA + thiếu sáng (giấy ~21% diện tích): trước ${kb(coByteCuaDataUrl(anhXaTruoc))} · ` +
      `sau ${kb(coByteCuaDataUrl(anhXaSau))} · sau+rõ ${kb(coByteCuaDataUrl(anhXaRo))}`);
  ghi(`    → Chạy \`npm run do-boc-chu\` để lấy con số độ chính xác đọc chữ.`);
  const khung = document.getElementById('anhThu');
  for (const [t, s] of [['gần: nguyên ảnh', anhTruoc], ['gần: đã cắt', anhSau],
    ['gần: cắt + làm rõ', anhSauRo], ['xa: nguyên ảnh', anhXaTruoc],
    ['xa: đã cắt', anhXaSau], ['xa: cắt + làm rõ', anhXaRo]]) {
    const f = document.createElement('figure');
    f.innerHTML = `<img src="${s}" alt="${t}"><figcaption>${t}</figcaption>`;
    khung.appendChild(f);
  }
}

/* ==========================================================================
   ③ DÒ GÓC ĐÚNG MẤY TRÊN SÁU CA
   ---------------------------------------------------------------------------
   "Đúng" = tự tin VÀ cả 4 góc lệch dưới 3% đường chéo ảnh so với góc thật.
   Ca `trang-tren-trang` cố ý KHÔNG đòi đúng: đòi ở đó là đòi phép màu. Đòi
   duy nhất là ĐỪNG TỰ TIN SAI — không nhận ra thì lùi về mép ảnh, im lặng.
   ========================================================================== */
ghi('\n─── ③ DÒ GÓC TRÊN SÁU CA THẬT (máy đoán chỉ là GỢI Ý) ───');
const CA = ['ban-go', 'nghieng', 'che-goc', 'hai-to', 'trang-tren-trang', 'kin-khung'];
const NHAN = {
  'ban-go': 'giấy trên bàn gỗ',
  'nghieng': 'chụp nghiêng',
  'che-goc': 'giấy bị che một góc',
  'hai-to': 'hai tờ giấy trong một ảnh',
  'trang-tren-trang': 'giấy trắng trên nền trắng',
  'kin-khung': 'chụp sát — giấy kín khung'
};
let soDung = 0, soTuTinSai = 0;
const bangCa = [];
for (const ten of CA) {
  const cn = ten === 'ban-go' ? canh : dungCanh(ten);
  const nenX = await nenAnhChung(await canvasThanhFile(cn.canvas, ten + '.jpg'), ANH_TRANG);
  const im = await taiAnh(nenX);
  const d = doanBonGoc(im);
  const cheo = Math.hypot(1, im.naturalHeight / im.naturalWidth);   // đường chéo chuẩn hoá
  const lech = Math.max(...d.goc.map((g, k) =>
    Math.hypot(g[0] - cn.goc[k][0], (g[1] - cn.goc[k][1]) * im.naturalHeight / im.naturalWidth) / cheo));
  const dung = d.tuTin && lech <= 0.03;
  if (dung) soDung++;
  if (d.tuTin && lech > 0.06) soTuTinSai++;
  bangCa.push({ ten, tuTin: d.tuTin, lech, ms: d.ms, viSao: d.viSao, dung,
                nhieuTo: d.nhieuTo, phuGiua: d.phuGiua, loiKhuyen: d.loiKhuyen });
  ghi(`  ${(dung ? 'ĐÚNG ' : d.tuTin ? '~lệch' : 'lùi  ').padEnd(6)} ${NHAN[ten].padEnd(30)} ` +
      `lệch ${(lech * 100).toFixed(1)}% · ${d.ms} ms · ${d.tuTin ? 'tự tin' : 'KHÔNG tự tin → mép ảnh'}` +
      ` · mép giữa ${(d.phuGiua * 100).toFixed(0)}%${d.nhieuTo ? ' → NHIỀU TỜ' : ''}`);
  if (!dung) ghi(`         lý do máy nêu: ${d.viSao}`);
}
ghi(`  ĐOÁN ĐÚNG ${soDung}/${CA.length} ca.`);

/* ---- MÀN HÌNH CÓ NÓI THẬT VỀ ĐỘ CHẮC CHẮN KHÔNG · REV-0056 lỗi #2 -------
   KHÔNG phải chỉnh ngưỡng cho khéo hơn — máy VẪN đoán sai ca hai tờ y như cũ
   (lệch 36%), và đoán sai là chuyện chấp nhận được. Thứ phải sửa là màn hình
   NÓI DỐI về độ chắc chắn của nó: bản trước khoe "4 mép rõ, 65% chiều dài"
   đúng lúc đang đoán sai. Nay nó nói đúng bệnh và khuyên một việc làm được. */
ghi('\n  ▸ Màn hình nói gì về độ chắc chắn của máy:');
{
  const h2 = bangCa.find(c => c.ten === 'hai-to');
  const donTo = bangCa.filter(c => c.ten !== 'hai-to');
  const caoNhatDon = Math.max(...donTo.map(c => c.phuGiua));
  ghi(`    "mép giữa" — ca hai tờ ${(h2.phuGiua * 100).toFixed(0)}% · ` +
      `tờ ĐƠN cao nhất ${(caoNhatDon * 100).toFixed(0)}% · ngưỡng 40%`);
  dat(h2.nhieuTo, 'Ca hai tờ → máy NHẬN RA có nhiều hơn một tờ');
  dat(donTo.every(c => !c.nhieuTo), 'Không ca tờ ĐƠN nào bị báo động giả "nhiều tờ"',
    `→ ${donTo.filter(c => c.nhieuTo).length} ca báo nhầm`);
  dat(caoNhatDon < 0.30, 'Ngưỡng 40% cách xa tờ đơn (tờ đơn phải dưới 30%)',
    `→ tờ đơn cao nhất ${(caoNhatDon * 100).toFixed(0)}%`);
  dat(/nhiều hơn một tờ/i.test(h2.loiKhuyen || '') && /chụp lại từng tờ/i.test(h2.loiKhuyen || ''),
    'Lời khuyên nói ĐÚNG BỆNH và bảo được việc phải làm',
    `→ "${(h2.loiKhuyen || '').slice(0, 52)}…"`);
  dat(bangCa.every(c => !/\d+\s*%/.test(c.loiKhuyen || '')),
    'KHÔNG lời khuyên nào chứa phần trăm — bỏ hẳn câu khoe');
  dat(bangCa.filter(c => c.dung).every(c => !c.loiKhuyen),
    'Máy đoán ĐÚNG thì IM LẶNG, không bắt Sếp đọc thêm dòng nào');
  /* ĐỐI CHỨNG: phép đo "báo động giả" phải bắt được nếu hạ ngưỡng xuống mức
     mà tờ đơn cũng lọt. Không bắt được thì con số trên vô nghĩa. */
  const nguongHong = caoNhatDon * 0.9;
  dat(donTo.some(c => c.phuGiua >= nguongHong),
    `ĐỐI CHỨNG: hạ ngưỡng xuống ${(nguongHong * 100).toFixed(0)}% → tờ đơn LỌT, phép đo bắt được`);
}
{
  /* CA HAI TỜ GIẤY — NÓI THẲNG, ĐỪNG CHẤM ĐẠT/HỎNG CHO CÓ.
     Ảnh có hai tờ thì KHÔNG có một đáp án đúng: máy chỉ dựng được MỘT tứ
     giác. Nó chọn cái khung ôm cả hai tờ. Đó là đoán SAI, và bàn đo phải in
     ra con số sai đó chứ không được giấu. Thứ bảo đảm ở đây không phải "máy
     đoán đúng" mà là "đoán sai thì kéo lại được trong vài giây" — mục ⑤
     chứng minh việc đó bằng cách kéo thật đủ bốn góc.
     Ràng buộc DUY NHẤT bắt buộc: khung đoán ra phải nằm trong ảnh và không
     lõm, để người ta kéo từ đó ra cái đúng chứ không phải làm lại từ đầu. */
  const h2 = bangCa.find(c => c.ten === 'hai-to');
  ghi(`  Ca "hai tờ giấy": máy dựng MỘT khung ôm cả hai, lệch ${(h2.lech * 100).toFixed(1)}% ` +
      'so với tờ thứ nhất — ĐOÁN SAI, và không có cách nào đoán đúng khi chỉ được dựng một khung.');
  /* ⚠️ SỐ ĐO, KHÔNG PHẢI CẢM TÍNH. Bản báo cáo trước tôi khai "kéo 2 góc là
     xong"; Hồ Ly đo lại ra 3/4 góc (31 · 70 · 54 px), và Hồ Ly đúng. Sửa
     hẳn con số ở đây để lần sau không ai chép lại lời khai cũ. */
  ghi('    → Xử: màn cắt vẫn bày, VÀ nay nói thẳng là ảnh có nhiều hơn một tờ.');
  ghi('    → Kéo về đúng một tờ được, nhưng phải kéo 3/4 góc (REV-0056 đo: 31 · 70 · 54 px).');
  ghi('    → Cách đúng vẫn là chụp từng tờ một — đó là lời khuyên màn hình đưa ra.');
  dat(bangCa.every(c => c.lech < 0.9),
    'Mọi ca: khung đoán ra vẫn nằm trong ảnh và kéo được (không ca nào lệch >90%)');
}
{
  const kk = bangCa.find(c => c.ten === 'kin-khung');
  ghi(`  Ca "kín khung": lệch ${(kk.lech * 100).toFixed(1)}% — coi như KHÔNG có gì để cắt, ` +
      'màn cắt sẽ không tự bày (kiểm ở mục ⑥).');
}

/* ==========================================================================
   ④ ĐỐI CHỨNG BH-16 — BỎ PHÉP DUỖI PHẲNG, THƯỚC ĐO PHẢI BẮT ĐƯỢC
   ========================================================================== */
ghi('\n─── ④ ĐỐI CHỨNG (BH-16): bỏ duỗi phẳng → ảnh nghiêng phải RA nghiêng ───');
{
  const cn = dungCanh('nghieng');
  const im = await taiAnh(await nenAnhChung(await canvasThanhFile(cn.canvas, 'ng.jpg'), ANH_TRANG));

  /* BẢN CÓ DUỖI: cắt theo đúng 4 góc thật rồi duỗi. */
  const co = duoiPhang(im, cn.goc, { canhToiDa: ANH_TRANG.canhToiDa }).canvas;
  const ngCo = doNghiengConLai(co);

  /* BẢN KHÔNG DUỖI (đối chứng): cắt CHỮ NHẬT bao quanh tứ giác — đúng thứ
     một cái "crop" tầm thường làm được, không có phối cảnh. */
  const xs = cn.goc.map(g => g[0]), ys = cn.goc.map(g => g[1]);
  const x0 = Math.round(Math.min(...xs) * im.naturalWidth);
  const x1 = Math.round(Math.max(...xs) * im.naturalWidth);
  const y0 = Math.round(Math.min(...ys) * im.naturalHeight);
  const y1 = Math.round(Math.max(...ys) * im.naturalHeight);
  const khong = document.createElement('canvas');
  khong.width = x1 - x0; khong.height = y1 - y0;
  khong.getContext('2d', { willReadFrequently: true })
    .drawImage(im, x0, y0, x1 - x0, y1 - y0, 0, 0, x1 - x0, y1 - y0);
  const ngKhong = doNghiengConLai(khong);

  ghi('  Thanh mốc trên trang giấy — độ nghiêng còn lại (đo bằng điểm ảnh):');
  ghi(`    CÓ duỗi phẳng:                    ${ngCo.do.toFixed(2)}°   (bắt trúng thanh mốc ${(ngCo.phu * 100).toFixed(0)}%)`);
  ghi(`    KHÔNG duỗi (cắt chữ nhật thường): ${ngKhong.do.toFixed(2)}°   (bắt trúng thanh mốc ${(ngKhong.phu * 100).toFixed(0)}%)`);
  dat(ngCo.phu > 0.7 && ngKhong.phu > 0.7,
    'Cả hai bản đều đo ĐÚNG thanh mốc (phủ >70% cửa sổ), không đo nhầm nét chữ');
  dat(Math.abs(ngCo.do) < 1.5, 'Sau duỗi phẳng, trang giấy nằm ngang (<1,5°)', `→ ${ngCo.do.toFixed(2)}°`);
  dat(Math.abs(ngKhong.do) > 3, 'ĐỐI CHỨNG: bỏ duỗi phẳng thì thước đo BẮT ĐƯỢC (>3°)',
    `→ ${ngKhong.do.toFixed(2)}°`);
  ghi(`  → Phép đo nhạy thật: chênh ${Math.abs(Math.abs(ngKhong.do) - Math.abs(ngCo.do)).toFixed(2)}° giữa hai bản.`);
}

/* ==========================================================================

ghi('\n─── ⑤ MÀN CẮT TRONG MÀN QUÉT THẬT, bề ngang 375px ───');

/* Máy ảnh giả — nhét đúng cảnh đang thử vào ô file rồi bắn `change`, y như
   điện thoại làm sau khi người ta bấm "Dùng ảnh này". */
let canhDangChup = canh.canvas;

HTMLInputElement.prototype.click = function () {
  if (this.type !== 'file') return clickGoc.call(this);
  canhDangChup.toBlob(b => {
    const dt = new DataTransfer();
    dt.items.add(new File([b], 'chup.jpg', { type: 'image/jpeg' }));
    this.files = dt.files;
    this.dispatchEvent(new Event('change', { bubbles: true }));

};

const nutKho = document.createElement('button');

/* ---- KÉO ĐƯỢC Ở CẢ BỐN GÓC, KỂ CẢ KHI GÓC NẰM SÁT MÉP ẢNH ---------------
   Bấm "Đặt lại 4 góc" trước: nó đưa cả bốn góc về ĐÚNG mép ảnh — đúng ca khó
   nhất, và cũng đúng trạng thái mặc định khi máy không đoán được. */
(await doi('[data-viec="cat-datlai"]')).click();
await cho(120);
const oVe = document.querySelector('#tlqCatVe');
const keo = (b, x, y) => {
  b.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 1, clientX: 0, clientY: 0, bubbles: true, cancelable: true }));
  document.dispatchEvent(new PointerEvent('pointermove', { pointerId: 1, clientX: x, clientY: y, bubbles: true, cancelable: true }));
  document.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1, clientX: x, clientY: y, bubbles: true, cancelable: true }));
};
let keoDuHet = true;
for (let k = 0; k < 4; k++) {
  const b = document.querySelectorAll('.tlq-cat-goc')[k];
  const truoc = b.style.left + '|' + b.style.top;
  const r = oVe.getBoundingClientRect();
  /* Kéo vào một điểm 30%/70% khác nhau cho từng góc — không kéo tất cả về
     cùng một chỗ, vì thế thì bốn góc chồng nhau và không biết cái nào ăn. */
  const dx = r.left + r.width * (0.28 + k * 0.05);
  const dy = r.top + r.height * (0.30 + k * 0.08);
  keo(b, dx, dy);
  await cho(80);

  const rs = sau.getBoundingClientRect();
  const trungDich = Math.hypot(rs.left + 22 - dx, rs.top + 22 - dy) < 3;
  if (!(doi_ && trungDich)) keoDuHet = false;
  dat(doi_ && trungDich,

    `→ lệch đích ${Math.hypot(rs.left + 22 - dx, rs.top + 22 - dy).toFixed(1)}px`);
}

/* ==========================================================================
   ⑦ KHÔNG ĐƯỢC MẤT ẢNH GỐC  ·  REV-0056 lỗi #1 (CHẶN PHÁT HÀNH)
   ---------------------------------------------------------------------------
   Ba việc phải chứng minh, và phải chứng minh bằng BYTE chứ không bằng mắt:
     ① cắt 3 lần liên tiếp → cỡ ảnh và cỡ tệp KHÔNG tụt dần
     ② bấm "↩ Ảnh gốc"    → băm SHA-256 TRÙNG KHÍT ảnh chưa cắt
     ③ thẻ trang không cao thêm dù nay có tới SÁU nút
   Kèm CA TỰ KIỂM ở cuối: gài lại đúng lỗi #1 rồi cho thấy phép đo bắt được.
   ========================================================================== */
ghi('\n─── ⑦ CẮT NHIỀU LẦN KHÔNG ĐƯỢC LÀM HỎNG ẢNH (REV-0056 #1) ───');
const bamChuoi = async (s) => {
  const b = new TextEncoder().encode(s);
  const h = await crypto.subtle.digest('SHA-256', b);
  return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
};
let khongTuiChatLuong = false, luiTrungKhit = false;
{
  phien && phien.dong();
  localStorage.removeItem(KHOA);
  canhDangChup = canh.canvas;
  nutKho.click();
  (await doi('[data-viec="chon-nhom"]')).click();
  await doi('#tlqCatKhung', 15000);
  ep375();
  (await doi('[data-viec="cat-bo"]')).click();
  await doi('.tlq-the');

  const nhap = () => JSON.parse(localStorage.getItem(KHOA) || 'null').trang[0];
  const goc0 = nhap();
  const bamGoc = await bamChuoi(goc0.anh);
  const dsLan = [];
  for (let lan = 1; lan <= 3; lan++) {
    (await doi('[data-viec="cat"][data-i="0"]')).click();
    await doi('#tlqCatKhung');
    ep375();
    /* Mỗi lượt kéo góc trên-trái vào 12% — ĐÚNG thao tác "cắt lại cho gọn". */
    const oVe = document.querySelector('#tlqCatVe');
    const r = oVe.getBoundingClientRect();
    const b = document.querySelectorAll('.tlq-cat-goc')[0];
    const x = r.left + r.width * 0.12, y = r.top + r.height * 0.12;
    b.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 1, clientX: 0, clientY: 0, bubbles: true, cancelable: true }));
    document.dispatchEvent(new PointerEvent('pointermove', { pointerId: 1, clientX: x, clientY: y, bubbles: true, cancelable: true }));
    document.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1, clientX: x, clientY: y, bubbles: true, cancelable: true }));
    await cho(80);
    (await doi('[data-viec="cat-xong"]')).click();
    await doi('.tlq-the');
    await cho(150);
    const tr = nhap();
    const im = await taiAnh(tr.anh);
    dsLan.push({ co: tr.co_nen, rong: im.naturalWidth, cao: im.naturalHeight });
    ghi(`  Cắt lần ${lan}: ${kb(tr.co_nen)} · ${im.naturalWidth}×${im.naturalHeight}`);
  }
  /* Phép đo đặt thành HÀM để ca tự kiểm ở dưới gọi lại được y hệt. */
  const khongTui = (ds) => ds.every(x => x.co === ds[0].co && x.rong === ds[0].rong && x.cao === ds[0].cao);
  khongTuiChatLuong = khongTui(dsLan);
  dat(khongTuiChatLuong, 'Cắt 3 lần liên tiếp: cỡ tệp và kích thước KHÔNG tụt dần',
    `→ ${dsLan.map(x => kb(x.co)).join(' · ')} · ${dsLan[0].rong}×${dsLan[0].cao}`);

  /* --- ĐƯỜNG LÙI --- */
  const nutLui = document.querySelector('[data-viec="cat-hoan"][data-i="0"]');
  dat(!!nutLui, 'Thẻ trang đã cắt có nút lùi, nói bằng tiếng người',
    nutLui ? `→ "${nutLui.textContent.trim()}" (${nutLui.getAttribute('aria-label')})` : '→ KHÔNG có');
  /* Sáu nút rồi mà thẻ VẪN không được cao thêm — cùng trần 116px mà
     `do-tai-tep` áp cho thẻ 5 nút. `do-tai-tep` không bao giờ cắt nên không
     bao giờ thấy thẻ 6 nút; chỗ này là chỗ duy nhất đo được nó. */
  const soNut = document.querySelectorAll('.tlq-the .tlq-nut-phu').length;
  const caoThe = document.querySelector('.tlq-the').getBoundingClientRect().height;
  const caoNut = [...document.querySelectorAll('.tlq-the .tlq-nut-phu')]
    .map(n => n.getBoundingClientRect().height);
  dat(caoThe <= 116, `Thẻ trang KHÔNG cao thêm dù nay có ${soNut} nút`,
    `→ ${caoThe.toFixed(0)}px (trần 116px của do-tai-tep)`);
  dat(caoNut.every(h => h >= 44), `Cả ${soNut} nút trong thẻ vẫn ≥44px`,
    `→ ${Math.min(...caoNut).toFixed(0)}px thấp nhất`);

  const xacNhanCu = window.confirm;
  window.confirm = () => true;
  nutLui.click();
  await cho(250);
  window.confirm = xacNhanCu;
  const sauLui = nhap();
  const bamSau = await bamChuoi(sauLui.anh);
  luiTrungKhit = bamGoc === bamSau;
  dat(luiTrungKhit, 'Bấm nút lùi → băm SHA-256 TRÙNG KHÍT ảnh gốc chưa cắt',
    `→ ${bamGoc.slice(0, 16)}… / ${bamSau.slice(0, 16)}…`);
  dat(!sauLui.da_cat && !sauLui.anh_goc && !sauLui.goc_cat,
    'Lùi xong, trang sạch dấu vết lượt cắt');

  /* --- BỘ NHỚ: giữ thêm ảnh gốc tốn bao nhiêu --- */
  {
    (await doi('[data-viec="cat"][data-i="0"]')).click();
    await doi('#tlqCatKhung'); ep375();
    (await doi('[data-viec="cat-xong"]')).click();
    await doi('.tlq-the'); await cho(150);
    const tr = nhap();
    const thanhBo = (o) => new Blob([JSON.stringify(o)]).size;
    const coDu = thanhBo(tr);
    const { anh_goc, ...gon } = tr;
    const coGon = thanhBo(gon);
    ghi(`  Một trang ĐÃ CẮT nặng ${kb(coDu)} trong bản nháp; bỏ ảnh gốc còn ${kb(coGon)} ` +
        `→ ảnh gốc tốn thêm ${kb(coDu - coGon)}/trang.`);
    ghi(`    10 trang đã cắt ≈ ${(coDu * 10 / 1048576).toFixed(1)} MB · ` +
        `12 trang (trần) ≈ ${(coDu * 12 / 1048576).toFixed(1)} MB — trần localStorage thường là 5 MB.`);
    ghi('    → Chạm trần thì ghiNhap() tự thử lượt hai KHÔNG kèm ảnh gốc, và màn hình');
    ghi('      nói thẳng là không lùi được nữa. Ảnh đã chụp KHÔNG bao giờ bị hi sinh.');

    /* ---- ÉP HẾT CHỖ THẬT, không nói suông ----------------------------
       Ràng buộc gốc của cả tính năng: ảnh đã chụp không được mất khi tắt
       máy. Thêm ảnh gốc là chạm trần localStorage sớm hơn, nên PHẢI chứng
       minh được thứ tự nhường: ảnh GỐC nhường trước, ảnh ĐANG DÙNG giữ tới
       cùng. Ép bằng cách cho `setItem` ném QuotaExceededError với chuỗi dài
       — đúng thứ trình duyệt thật ném khi hết chỗ. */
    const setCu = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      if (String(k).startsWith('tl_nhap_') && String(v).length > 320000) {
        const e = new Error('hết chỗ (ép để thử)');
        e.name = 'QuotaExceededError';
        throw e;
      }
      return setCu.call(this, k, v);
    };
    try {
      (await doi('[data-viec="cat"][data-i="0"]')).click();
      await doi('#tlqCatKhung'); ep375();
      (await doi('[data-viec="cat-xong"]')).click();
      await doi('.tlq-the'); await cho(200);
      const trHet = nhap();
      dat(!!trHet && !!trHet.anh,
        'HẾT CHỖ: ảnh ĐÃ CHỤP vẫn được lưu — không bao giờ hi sinh ảnh',
        `→ ${trHet && trHet.anh ? kb(trHet.co_nen) : 'MẤT'}`);
      dat(!!trHet && !trHet.anh_goc,
        'HẾT CHỖ: ảnh gốc là thứ bị bỏ TRƯỚC, đúng thứ tự nhường');
      const canh = [...document.querySelectorAll('.tlq-canh')]
        .map(p => p.textContent).join(' ');
      dat(/không giữ được ảnh gốc/i.test(canh),
        'HẾT CHỖ: màn hình NÓI RA là không lùi được nữa, không nhường lặng lẽ');
    } finally {
      Storage.prototype.setItem = setCu;
    }
  }
}

/* ---- CA TỰ KIỂM (BH-16): gài LẠI lỗi #1 → phép đo phải bắt được ---------
   Không có ca này thì hai dòng ĐẠT ở trên chỉ là lời khai. Dựng lại đúng dãy
   số mà bản CHƯA VÁ cho ra (đo thật, REV-0056 mục ③b) rồi đưa qua CÙNG một
   hàm kiểm — nó phải đỏ. */
{
  const dayHong = [{ co: 176128, rong: 980, cao: 1367 },
                   { co: 141312, rong: 967, cao: 1197 },
                   { co: 49152, rong: 558, cao: 590 }];
  const khongTui = (ds) => ds.every(x => x.co === ds[0].co && x.rong === ds[0].rong && x.cao === ds[0].cao);
  dat(!khongTui(dayHong),
    'ĐỐI CHỨNG: đưa lại dãy số của bản CHƯA VÁ (172→138→48 KB) → phép đo BẮT ĐƯỢC');
  /* Và ca đối chứng cho đường lùi: trang không có `anh_goc` thì không thể lùi. */
  const trangHong = { anh: 'data:image/jpeg;base64,AAAA', da_cat: true };
  dat(!trangHong.anh_goc,
    'ĐỐI CHỨNG: trang kiểu CŨ (không có anh_goc) → không có gì để lùi, phép đo thấy ngay');
}

/* Ca KÍN KHUNG: chụp sát giấy → màn cắt KHÔNG được tự bày. */
{
  phien && phien.dong();
  localStorage.removeItem(KHOA);
  canhDangChup = dungCanh('kin-khung').canvas;
  nutKho.click();
  (await doi('[data-viec="chon-nhom"]')).click();
  await doi('.tlq-the');
  /* Chờ đủ lâu cho lượt dò góc chạy xong — bày muộn cũng là bày. */
  await cho(2500);
  const coManCat = !!document.querySelector('#tlqCatKhung');
  dat(!coManCat, 'Chụp sát giấy (kín khung) → màn cắt KHÔNG tự bày, không bấm thừa');
  phien && phien.dong();
}

/* Ca HAI TỜ: lời khuyên phải LÊN ĐƯỢC MÀN HÌNH, không chỉ nằm trong đối
   tượng trả về. Khẳng định `loiKhuyen` có chữ mà không kiểm nó có được vẽ ra
   hay không thì đúng là kiểu "đọc mã rồi đoán" mà REV-0056 đã chê. */
{
  localStorage.removeItem(KHOA);
  canhDangChup = dungCanh('hai-to').canvas;
  nutKho.click();
  (await doi('[data-viec="chon-nhom"]')).click();
  await doi('#tlqCatKhung', 15000);
  ep375();
  const canhBao = [...document.querySelectorAll('.tlq-than .tlq-canh')]
    .map(p => p.textContent.replace(/\s+/g, ' ').trim()).join(' | ');
  dat(/nhiều hơn một tờ/i.test(canhBao),
    'Ca hai tờ: lời khuyên HIỆN THẬT trên màn cắt', `→ "${canhBao.slice(0, 64)}…"`);
  const moiChu = document.querySelector('.tlq-than').textContent;
  dat(!/\d+\s*%\s*chiều dài/.test(moiChu),
    'Màn cắt KHÔNG còn câu khoe "N% chiều dài" ở bất kỳ đâu');
  phien && phien.dong();
}

ghi('\n───────────────────────────────────────────────────────────');
ghi(`KET_LUAN doan_dung=${soDung}/${CA.length} tu_tin_sai=${soTuTinSai} ` +
    `ms_tong=${Math.round(msTong)} ms_tong_lamro=${Math.round(msTongRo)} ` +
    `co_truoc=${coTruoc} co_sau=${coSau} co_sau_lamro=${coSauRo} ` +
    `cham_44=${du44} keo_4_goc=${keoDuHet} ` +
    `khong_tui_chat_luong=${khongTuiChatLuong} lui_trung_khit=${luiTrungKhit}`);
} catch (e) {
  ghi('✗ BÀN ĐO HỎNG: ' + e.message + '\n' + e.stack);
}
</script>
