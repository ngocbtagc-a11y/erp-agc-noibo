name = "erp-agc"
main = "src/index.js"
compatibility_date = "2026-06-10"

# Giao diện tĩnh nằm trong public/.
# binding = "ASSETS" để trong Worker gọi được env.ASSETS.fetch() cho các
# đường dẫn không khớp file nào.
[assets]
directory = "public"
binding = "ASSETS"

# Database D1 — gói miễn phí: 5GB, 5 triệu lượt đọc/ngày
# database_id do `npm run cai-dat` tự điền, không cần sửa tay.
[[d1_databases]]
binding = "DB"
database_name = "crm-agc"
database_id = "0575dabe-5bdc-4146-ba5d-6f21e9d1cdc0"

[observability]
enabled = true

# AI của Cloudflare (Workers AI) — dùng để đọc ảnh CCCD bóc thông tin.
# Tài khoản đã có sẵn quyền AI, không cần khai thêm khóa.
[ai]
binding = "AI"

# Biến công khai (KHÔNG bí mật). App Secret KHÔNG để đây — nó nằm trong
# "két" Cloudflare (Settings → Variables and Secrets → Secret TIKTOK_APP_SECRET).
[vars]
TIKTOK_APP_KEY = "6kvjhfjc9v709"
TIKTOK_SERVICE_ID = "7674557494503769877"
SHOPEE_PARTNER_ID = "1241414"

# Lịch chạy nền: MỖI 5 PHÚT tự đồng bộ đơn hoàn Shopee + TikTok về DB
# (gần realtime). Sàn nào chưa kết nối thì bỏ qua êm; token tự làm mới.
[triggers]
crons = ["*/5 * * * *"]

# ---- Shopee (BỎ COMMENT + điền khi đã có khóa) ---------------------------
# partner_id KHÔNG bí mật → để ở [vars]. partner_key BÍ MẬT → đặt bằng lệnh:
#     npx wrangler secret put SHOPEE_PARTNER_KEY
# (khóa nằm trong "két" của Cloudflare, KHÔNG viết vào file này)
# [vars]
# SHOPEE_PARTNER_ID = "123456"
# SHOPEE_HOST = "https://partner.shopeemobile.com"
# SHOPEE_REDIRECT = "https://erp-agc.noiboagc.workers.dev/api/shopee/callback"
