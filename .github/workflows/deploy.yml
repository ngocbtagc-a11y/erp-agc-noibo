# Tự động deploy ERP lên Cloudflare mỗi khi có thay đổi được đẩy lên nhánh main.
# Nhờ vậy, với nhân viên, "deploy" = CHỈ CẦN đẩy code lên GitHub. Không cần cài
# wrangler hay đăng nhập Cloudflare trên máy — an toàn hơn vì không phát tán khóa
# Cloudflare ra nhiều máy. Xem tiến trình/kết quả ở tab "Actions" trên GitHub.
name: Deploy ERP lên Cloudflare

on:
  push:
    branches: [main]        # đẩy lên main -> tự deploy
  workflow_dispatch:         # cho phép bấm chạy tay trong tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Account ID KHÔNG bí mật (chỉ là mã định danh tài khoản, không phải khóa)
      CLOUDFLARE_ACCOUNT_ID: ac4732957e4ef577d32bfe4595f8f022
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần đủ lịch sử để đọc được CÁC COMMIT TRONG LƯỢT ĐẨY NÀY
          # (github.event.before..github.sha). Nông quá thì git log không thấy
          # commit cũ, và bước chốt góp ý bên dưới tự lùi về "chỉ commit cuối".
          #
          # ⚠️ TỪ 50 LÊN 0 — REV-0064 H1. Máy chủ có trần 200 commit VÀ kêu
          # Telegram khi cắt; nhưng `fetch-depth: 50` cắt TRƯỚC ĐÓ, ở ngưỡng
          # thấp hơn bốn lần, và cắt IM LẶNG: `git cat-file -e` hỏng, phamVi()
          # lùi về đúng một commit cuối, in một dòng console thường — không
          # `::warning::`, không Telegram. Trần 200 không bao giờ chạm tới.
          # Nhánh này vừa gộp 102 commit của main: đúng cỡ lượt đẩy kích hoạt.
          # `0` = lấy đủ lịch sử; và nhánh lùi trong bao-deploy-len-erp.mjs nay
          # CÓ KÊU (::warning:: cho Actions + Telegram qua ERP) — hai lớp.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Deploy bằng wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          # Khóa BÍ MẬT — lưu trong GitHub Secrets, KHÔNG viết thẳng vào file này
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      # ====================================================================
      # BÁO VỀ ERP: NHỮNG GÓP Ý NÀO VỪA ĐƯỢC SỬA XONG VÀ ĐÃ LÊN THẬT
      # --------------------------------------------------------------------
      # Sếp Ngọc 28/08/2026: "lỗi nào đã làm xong thì hiện đã xong đi chứ".
      # Trước bước này, quy trình là: góp ý → duyệt → xây → soi → đẩy lên…
      # RỒI HẾT. Không ai quay lại đổi trạng thái góp ý, nên người báo lỗi
      # không bao giờ biết lỗi của mình đã được sửa.
      #
      # SỢI DÂY: TUYÊN BỐ VÁ trong THÔNG ĐIỆP COMMIT (`Vá GY-12`, từ khoá ở
      # ĐẦU DÒNG) + DANH SÁCH FILE commit đó đổi thật. Bước này đọc mọi commit
      # vừa lên, gói lại, ký HMAC rồi POST về chính ERP vừa deploy. Thông điệp
      # commit là lời khai, danh sách file là bằng chứng — máy chủ đòi cả hai
      # (REV-0042 C1). Và từ REV-0064 C1: NHẮC TÊN một mã KHÔNG phải là vá nó —
      # không có `Vá` thì máy chỉ đính bằng chứng, không đổi trạng thái, không
      # nhắn người báo. Cách viết: xem HUONG-DAN-DEPLOY.md §"Vá GY-…".
      # Không dịch vụ mới, không cron mới, không khoá của bên thứ ba, chi phí 0.
      #
      # ⚠️ KHÔNG ĐƯỢC LÀM HỎNG DEPLOY. Deploy đã xong ở bước trên; đây chỉ là
      # báo tin. `continue-on-error` để một lần mạng lỗi không nhuộm đỏ một bản
      # deploy đã thành công.
      #
      # ⚠️ NHƯNG JOB XANH KHÔNG CÓ NGHĨA LÀ ĐƯỜNG NÀY CHẠY (REV-0042 mục 3).
      # Vì `continue-on-error`, bước này hỏng thì job vẫn xanh — mà không ai
      # đọc nhật ký Actions mỗi ngày. Nên chuông thật KHÔNG nằm ở màu job:
      #   ① bước này in `::warning::` (hiện ngay đầu trang Actions), VÀ
      #   ② nó gõ cửa ERP MỖI LƯỢT DEPLOY — kể cả lượt không commit nào nhắc
      #      mã góp ý — nên khoá lệch/thiếu làm ERP bắn Telegram cho Sếp
      #      (tối đa 1 tin/ngày). Lệch khoá lộ ra NGAY HÔM NÓ LỆCH, không đợi
      #      tới hôm có góp ý thật bị bỏ rơi.
      # ====================================================================
      - name: Báo ERP những góp ý vừa lên hệ thống
        continue-on-error: true
        env:
          ERP_URL: https://erp-agc.noiboagc.workers.dev
          # Khoá chung với két Cloudflare:
          #   npx wrangler secret put DEPLOY_CHOT_KHOA
          # Hai bên phải GIỐNG HỆT NHAU. Thiếu/lệch một bên thì KHÔNG góp ý nào
          # bị đổi, và Sếp nhận Telegram báo đường này đang hỏng.
          DEPLOY_CHOT_KHOA: ${{ secrets.DEPLOY_CHOT_KHOA }}
          DEPLOY_TRUOC: ${{ github.event.before }}
          DEPLOY_NAY: ${{ github.sha }}
        run: node scripts/bao-deploy-len-erp.mjs
